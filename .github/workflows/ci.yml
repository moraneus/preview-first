name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        python: ["3.9", "3.12"]
        include:
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Validate knowledge graph
        run: python skills/preview-first/scripts/validate_graph.py --quiet
      - name: Install pytest
        run: python -m pip install --quiet pytest
      - name: Run tests
        run: python -m pytest -q
      - name: Smoke build the preview
        shell: bash
        run: |
          python skills/preview-first/scripts/build_preview.py --directions tests/fixtures/directions_two.json --out "$RUNNER_TEMP/preview-smoke"
          test -f "$RUNNER_TEMP/preview-smoke/index.html"
          test -f "$RUNNER_TEMP/preview-smoke/A/devices.html"
