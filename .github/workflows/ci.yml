name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Validate knowledge graph
        run: python3 skills/preview-first/scripts/validate_graph.py --quiet
      - name: Install pytest
        run: python3 -m pip install --quiet pytest
      - name: Run tests
        run: python3 -m pytest -q
      - name: Smoke build the preview
        run: |
          python3 skills/preview-first/scripts/build_preview.py --directions tests/fixtures/directions_two.json --out /tmp/preview-smoke
          test -f /tmp/preview-smoke/index.html
          test -f /tmp/preview-smoke/A/devices.html
